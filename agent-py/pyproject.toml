[project]
name = "mandate-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Emeka", email = "christian1emeka@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.1",
    "pydantic-ai-slim[mcp,openai]>=2.51.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
