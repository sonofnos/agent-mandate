name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - name: Unit + Testcontainers integration tests (real Postgres)
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  e2e:
    # Builds the real image, runs it with Postgres, and drives it from the Python agent over MCP.
    runs-on: ubuntu-latest
    needs: [dotnet, python]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker compose up -d --build --wait db && docker compose up -d --build api
      - name: Wait for API
        run: for i in $(seq 1 60); do curl -sf localhost:8080/health && exit 0; sleep 2; done; docker compose logs api; exit 1
      - name: Python agent -> MCP -> .NET gateway
        working-directory: agent-py
        env:
          MANDATE_URL: http://localhost:8080
        run: uv sync && uv run pytest -q
      - name: Scripted-model eval smoke test (no API key)
        env:
          MANDATE_URL: http://localhost:8080
        run: python3 evals/run_evals.py small-transfer needs-approval raw-account-number unknown-alias
      - if: failure()
        run: docker compose logs api
